[package]
name = "ofm-search"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# T7.1 (ADR-0009): ofm-vfs (archive hook), regex (name/content patterns), memchr (line
# scanning), tracing (diagnostics). Encodings and decoding come from ofm-viewer, so no
# encoding_rs / chardetng here. Dev: fixtures (ofm-testkit), property tests (proptest).
[dependencies]
ofm-core = { path = "../ofm-core" }
ofm-viewer = { path = "../ofm-viewer" }
ofm-vfs = { path = "../ofm-vfs" }
async-channel.workspace = true
thiserror.workspace = true
tracing.workspace = true
memchr = "2.8.3"
regex = "1.13.1"

[dev-dependencies]
ofm-testkit = { path = "../ofm-testkit" }
encoding_rs = "0.8.44"
proptest = "1.12.0"
# 7z fixtures (directories, encrypted entries) without system tools.
sevenz-rust2 = { version = "0.25", features = ["compress"] }
tempfile = "3.27.0"
