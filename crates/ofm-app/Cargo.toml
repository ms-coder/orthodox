[package]
name = "ofm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "ofm_app"
path = "src/lib.rs"

[[bin]]
name = "ofm"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow.workspace = true
async-channel.workspace = true
# O_NOFOLLOW for the terminal wrapper files (already in the lockfile via gtk/glib).
libc = "0.2"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
ofm-config = { path = "../ofm-config" }
ofm-core = { path = "../ofm-core" }
ofm-jobs = { path = "../ofm-jobs" }
ofm-viewer = { path = "../ofm-viewer" }
ofm-vfs = { path = "../ofm-vfs" }
tracing.workspace = true
tracing-subscriber.workspace = true
# Embedded terminal (ADR-0003). 0.10 pairs with the gtk4 0.11 above (same gtk4-sys 0.11.x,
# glib 0.22.x); feature level v0_76 = the minimum system VTE of Ubuntu 24.04 LTS (CLAUDE.md
# Stack) — do not raise without an ADR.
vte4 = { version = "0.10", features = ["v0_76"] }

[dev-dependencies]
ofm-testkit = { path = "../ofm-testkit" }
ofm-jobs = { path = "../ofm-jobs", features = ["testing"] }
