# OFM keymap preset: tc. Generated from docs/COMMANDS.md by T1.0; hand-maintained afterwards (T1.3).
# Format: ADR-0005. Section = context; `"<chord>" = "<command id>"`.
version = 1
preset = "tc"
typing = "quick_search"   # command_line | quick_search

[global]
"Alt+F4" = "app.quit"
"F9" = "app.menu"
"F10" = "app.menu"
"F1" = "app.help"
"Ctrl+," = "app.preferences"
"Ctrl+J" = "app.jobs"
"Ctrl+O" = "app.terminal_toggle"
"Ctrl+Alt+T" = "app.theme_next"
"Ctrl+Alt+R" = "app.reload_config"
"F11" = "window.fullscreen"

[panels]
"Up" = "panel.cursor_up"
"Down" = "panel.cursor_down"
"Left" = "panel.cursor_left"
"Right" = "panel.cursor_right"
"PgUp" = "panel.page_up"
"PgDn" = "panel.page_down"
"Home" = "panel.home"
"End" = "panel.end"
"Tab" = "panel.switch"
"Ctrl+P" = "panel.toggle_other"
"Ctrl+U" = "panel.swap"
"Alt+=" = "panel.same_dir"
"Ctrl+R" = "panel.refresh"
"Backspace" = "panel.go_up"
"Ctrl+PgUp" = "panel.go_up"
"Ctrl+\\" = "panel.go_root"
"Ctrl+Home" = "panel.go_home"
"Ctrl+L" = "panel.goto_path"
"Enter" = "panel.open"
"Ctrl+PgDn" = "panel.enter_dir"
"Alt+Left" = "panel.history_back"
"Alt+Right" = "panel.history_forward"
"Alt+F12" = "panel.history_list"
"Ctrl+D" = "panel.hotlist"
"Ctrl+Shift+D" = "panel.hotlist_add"
"Alt+F1" = "panel.drive_menu_left"
"Alt+F2" = "panel.drive_menu_right"
"Ctrl+1" = "panel.view_brief"
"Ctrl+2" = "panel.view_full"
"Ctrl+3" = "panel.view_custom"
"Ctrl+F3" = "panel.sort_name"
"Ctrl+F4" = "panel.sort_ext"
"Ctrl+F5" = "panel.sort_mtime"
"Ctrl+F6" = "panel.sort_size"
"Ctrl+F12" = "panel.sort_reverse"
"Ctrl+H" = "panel.toggle_hidden"
"Ctrl+Q" = "panel.toggle_quickview"
"Shift+F10" = "panel.context_menu"
"Menu" = "panel.context_menu"
"Shift+F2" = "panel.compare_dirs"
"Ctrl+S" = "panel.quicksearch"
"Ctrl+Down" = "panel.quicksearch_next"
"Ctrl+Up" = "panel.quicksearch_prev"
"Ctrl+Shift+S" = "panel.filter"
"Esc" = "panel.cancel"
"Ctrl+T" = "tab.new"
"Ctrl+W" = "tab.close"
"Ctrl+Tab" = "tab.next"
"Ctrl+Shift+Tab" = "tab.prev"
"Ctrl+Shift+L" = "tab.lock"
"Ins" = "select.toggle"
"Space" = "select.toggle"
"Shift+Up" = "select.extend_up"
"Shift+Down" = "select.extend_down"
"Shift+PgUp" = "select.extend_page_up"
"Shift+PgDn" = "select.extend_page_down"
"Shift+Home" = "select.extend_home"
"Shift+End" = "select.extend_end"
"Gray+" = "select.by_mask"
"Gray-" = "select.unmask"
"Gray*" = "select.invert"
"Ctrl+A" = "select.all"
"Ctrl+Gray+" = "select.all"
"Ctrl+Gray-" = "select.none"
"Ctrl+M" = "select.restore"
"F3" = "file.view"
"F4" = "file.edit"
"Shift+F4" = "file.new_file"
"F5" = "file.copy"
"F6" = "file.move"
"Shift+F6" = "file.rename"
"F7" = "file.mkdir"
"F8" = "file.delete"
"Del" = "file.delete"
"Shift+Del" = "file.delete_permanent"
"Shift+F8" = "file.delete_permanent"
"Alt+F6" = "file.link"
"Alt+Enter" = "file.properties"
"Alt+Shift+Enter" = "file.calc_size"
"Ctrl+Shift+M" = "file.batch_rename"
"Ctrl+Alt+Z" = "file.batch_rename_undo"
"Ctrl+C" = "file.clipboard_copy"
"Ctrl+X" = "file.clipboard_cut"
"Ctrl+V" = "file.clipboard_paste"
"Ctrl+Shift+C" = "file.copy_path"
"Shift+Enter" = "file.open_with"
"F2" = "menu.user"
"Ctrl+Alt+M" = "menu.edit"
"Ctrl+Alt+Shift+M" = "menu.edit_local"
"Alt+F7" = "search.find"
"Ctrl+Alt+P" = "search.panelize_command"
"Ctrl+E" = "cmdline.history_prev"
"Ctrl+Shift+E" = "cmdline.history_next"
"Alt+F8" = "cmdline.history_list"
"Ctrl+Enter" = "cmdline.insert_name"
"Ctrl+F" = "cmdline.insert_fullpath"
"Ctrl+[" = "cmdline.insert_left_path"
"Ctrl+]" = "cmdline.insert_right_path"

[cmdline]
"Enter" = "cmdline.execute"
"Esc" = "cmdline.clear"
"Ctrl+Space" = "cmdline.complete"
"Tab" = "cmdline.complete" # only while the line has text; empty line -> panels -> panel.switch

[viewer]
"Esc" = "viewer.close"
"F10" = "viewer.close"
"F4" = "viewer.toggle_hex"
"F8" = "viewer.encoding"
"F7" = "viewer.search"
"Shift+F7" = "viewer.search_next"
"Alt+F7" = "viewer.search_prev"
"F2" = "viewer.wrap"
"Alt+F8" = "viewer.goto"
"Up" = "viewer.line_up"
"Down" = "viewer.line_down"
"PgUp" = "viewer.page_up"
"PgDn" = "viewer.page_down"
"Space" = "viewer.page_down"
"Home" = "viewer.top"
"End" = "viewer.bottom"
"Left" = "viewer.scroll_left"
"Right" = "viewer.scroll_right"
"Gray+" = "viewer.next_file"
"Gray-" = "viewer.prev_file"

[dialog]
"Enter" = "dialog.ok"
"Esc" = "dialog.cancel"
"F2" = "dialog.queue"
"Ctrl+A" = "dialog.apply_all"
"F10" = "search.panelize_results"
"Space" = "jobs.pause_resume"
"Del" = "jobs.cancel"
"Ctrl+L" = "jobs.clear_finished"
