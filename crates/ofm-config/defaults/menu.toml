# User menu (F28). Global: $XDG_CONFIG_HOME/ofm/menu.toml ; per directory: ./.ofm-menu.toml
# (local entries are listed first, and only used after you trusted them). Placeholders:
# %f file under cursor, %s selected names (quoted, space separated; the cursor file when
# nothing is selected), %d this dir, %D other dir, %F file in other panel, %n name without
# extension, %{input:Prompt} asks the user, %% a literal percent. Everything substituted is
# shell-quoted for the target shell.
version = 1

[[item]]
key = "T"                       # hotkey inside the menu
title = "tar.gz selection"
command = "tar -czf %{input:Archive name}.tar.gz %s"
mask = ""                       # optional: only show when the cursor file matches
terminal = true                 # run in the embedded terminal (false = background, output hidden)
confirm = false                 # ask before running

[[item]]
key = "R"
title = "rsync selection to other panel"
command = "rsync -av %s %D"
terminal = true

[[item]]
key = "H"
title = "open terminal here"
command = "cd -- %d && exec $SHELL"
terminal = true
