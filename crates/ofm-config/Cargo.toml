[package]
name = "ofm-config"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ofm-core = { path = "../ofm-core" }
async-channel.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
# `renameat2(RENAME_NOREPLACE)` for the no-clobber publication of the default menu on
# filesystems without hard links, and `mkfifo`/open flags in tests.
libc = "0.2"
# Already in the dependency tree (parser behind `toml`); used directly for
# order-preserving keymap parsing and in-place edits that keep comments.
toml_edit = "0.25"
notify = "8"

[dev-dependencies]
tempfile = "3"
